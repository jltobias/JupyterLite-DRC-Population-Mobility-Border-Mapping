<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Open DRC mobility map in GeoLibre Web</title>
</head>
<body>
  <p>Opening the DRC demonstration layers in <a id="launch" href="#">GeoLibre Web</a>…</p>
  <script>
    const sources = [
      'https://raw.githubusercontent.com/jltobias/JupyterLite-DRC-Population-Mobility-Border-Mapping/main/data/drc-mobility-demo.geojson',
      'https://raw.githubusercontent.com/healthsites/drc-ebola-2026/master/healthsites_ituri_drc.geojson',
      'https://jltobias.github.io/JupyterLite-DRC-Population-Mobility-Border-Mapping/data/african-bat-database.geojson',
      'https://raw.githubusercontent.com/jltobias/JupyterLite-DRC-Population-Mobility-Border-Mapping/main/data/overture/buildings-goma-sample.geojson',
      'https://raw.githubusercontent.com/jltobias/JupyterLite-DRC-Population-Mobility-Border-Mapping/main/data/osm/poi-goma-sample.geojson',
      'https://geospatial.jrc.ec.europa.eu/geoserver/wms?service=WMS&request=GetMap&version=1.1.1&layers=africa_platform:ghsl_BuiltUpSurface_2020_3ss&styles=&format=image/png&transparent=true&srs=EPSG:3857&width=256&height=256&bbox={bbox-epsg-3857}',
      'https://raw.githubusercontent.com/jltobias/JupyterLite-DRC-Population-Mobility-Border-Mapping/main/data/whymap/geojson/karst.geojson',
      'https://raw.githubusercontent.com/jltobias/JupyterLite-DRC-Population-Mobility-Border-Mapping/main/data/whymap/geojson/caves.geojson',
      'https://raw.githubusercontent.com/jltobias/JupyterLite-DRC-Population-Mobility-Border-Mapping/main/data/whymap/geojson/non_exposed_karst.geojson',
      'https://raw.githubusercontent.com/jltobias/JupyterLite-DRC-Population-Mobility-Border-Mapping/main/data/whymap/geojson/springs.geojson',
      ...['COD','UGA','RWA','BDI','SSD','ZMB','TZA','CAF','COG','AGO'].map(iso => `https://geodata.ucdavis.edu/gadm/gadm4.1/json/gadm41_${iso}_1.json`)
    ];
    const target = new URL('https://web.geolibre.app/');
    sources.forEach(url => target.searchParams.append('data', url));
    target.searchParams.set('layout', 'viewer');
    document.getElementById('launch').href = target;
    window.location.replace(target);
  </script>
</body>
</html>
