<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Open DRC mobility map in GeoLibre Web</title>
</head>
<body>
  <p>Opening the DRC demonstration layers in <a id="launch" href="#">GeoLibre Web</a>…</p>
  <script>
    const target = 'https://web.geolibre.app/?data=https://raw.githubusercontent.com/jltobias/JupyterLite-DRC-Population-Mobility-Border-Mapping/main/data/drc-mobility-demo.geojson&data=https://raw.githubusercontent.com/healthsites/drc-ebola-2026/master/healthsites_ituri_drc.geojson&layout=viewer';
    document.getElementById('launch').href = target;
    window.location.replace(target);
  </script>
</body>
</html>
