<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DRC mobility map — MapLibre GL JS</title>
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <style>html,body,#map{height:100%;margin:0}#notice{position:absolute;z-index:1;top:12px;left:12px;max-width:320px;padding:12px 14px;background:#fffdf8ee;border-radius:10px;font:14px system-ui,sans-serif;box-shadow:0 2px 12px #0003}</style>
</head>
<body>
  <div id="notice"><strong>MapLibre GL JS experience</strong><br><small>Demonstration values only. Replace with dated, documented extracts before analysis.</small></div>
  <div id="map"></div>
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script>
    const dataUrl = 'https://raw.githubusercontent.com/jltobias/JupyterLite-DRC-Population-Mobility-Border-Mapping/main/data/drc-mobility-demo.geojson';
    const worldMoveUrl = 'https://raw.githubusercontent.com/jltobias/JupyterLite-DRC-Population-Mobility-Border-Mapping/main/data/worldmove/worldmove-drc-great-lakes.geojson';
    const dtmUrl = 'https://raw.githubusercontent.com/jltobias/JupyterLite-DRC-Population-Mobility-Border-Mapping/main/data/dtm/dtm-drc-displacement.geojson';
    const healthsitesUrl = 'https://raw.githubusercontent.com/healthsites/drc-ebola-2026/master/healthsites_ituri_drc.geojson';
    const batUrl = 'https://jltobias.github.io/JupyterLite-DRC-Population-Mobility-Border-Mapping/data/african-bat-database.geojson';
    const buildingsUrl = 'https://raw.githubusercontent.com/jltobias/JupyterLite-DRC-Population-Mobility-Border-Mapping/main/data/overture/buildings-goma-sample.geojson';
    const osmPoiUrl = 'https://raw.githubusercontent.com/jltobias/JupyterLite-DRC-Population-Mobility-Border-Mapping/main/data/osm/poi-goma-sample.geojson';
    const airportsUrl = 'https://raw.githubusercontent.com/jltobias/JupyterLite-DRC-Population-Mobility-Border-Mapping/main/data/natural-earth/airports-10m.geojson';
    const hydroRiversUrl = 'https://raw.githubusercontent.com/jltobias/JupyterLite-DRC-Population-Mobility-Border-Mapping/main/data/hydrosheds/hydrorivers-af-drc-great-lakes.geojson';
    const ghslWmsUrl = 'https://geospatial.jrc.ec.europa.eu/geoserver/wms?service=WMS&request=GetMap&version=1.1.1&layers=africa_platform:ghsl_BuiltUpSurface_2020_3ss&styles=&format=image/png&transparent=true&srs=EPSG:3857&width=256&height=256&bbox={bbox-epsg-3857}';
    const gadmUrls = ['COD','UGA','RWA','BDI','SSD','ZMB','TZA','CAF','COG','AGO'].map(iso => `https://raw.githubusercontent.com/jltobias/JupyterLite-DRC-Population-Mobility-Border-Mapping/main/data/gadm/gadm41_${iso}_1.json`);
    const karstUrls = ['karst','caves','non_exposed_karst','springs'].map(name => `https://raw.githubusercontent.com/jltobias/JupyterLite-DRC-Population-Mobility-Border-Mapping/main/data/whymap/geojson/${name}.geojson`);
    const map = new maplibregl.Map({container:'map',center:[28.8,-2.5],zoom:5.1,style:{version:8,sources:{osm:{type:'raster',tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],tileSize:256,attribution:'© OpenStreetMap contributors'}},layers:[{id:'osm',type:'raster',source:'osm'}]}});
    map.addControl(new maplibregl.NavigationControl(),'bottom-right');
    map.on('load', async () => {
      map.addSource('ghsl',{type:'raster',tiles:[ghslWmsUrl],tileSize:256,attribution:'GHSL / European Commission JRC'});
      map.addLayer({id:'ghsl',type:'raster',source:'ghsl',paint:{'raster-opacity':0.38}});
      const [response, worldMoveResponse, dtmResponse, healthsitesResponse, batResponse, buildingsResponse, osmPoiResponse, airportsResponse, hydroRiversResponse, ...allResponses] = await Promise.all([fetch(dataUrl), fetch(worldMoveUrl), fetch(dtmUrl), fetch(healthsitesUrl), fetch(batUrl), fetch(buildingsUrl), fetch(osmPoiUrl), fetch(airportsUrl), fetch(hydroRiversUrl), ...gadmUrls.map(url => fetch(url)), ...karstUrls.map(url => fetch(url))]);
      const gadmResponses = allResponses.slice(0, gadmUrls.length);
      const karstResponses = allResponses.slice(gadmUrls.length);
      const demo = await response.json();
      const worldMove = await worldMoveResponse.json();
      const dtm = await dtmResponse.json();
      const healthsites = await healthsitesResponse.json();
      const bats = await batResponse.json();
      const buildings = await buildingsResponse.json();
      const osmPoi = await osmPoiResponse.json();
      const airports = await airportsResponse.json();
      const hydroRivers = await hydroRiversResponse.json();
      const gadm = await Promise.all(gadmResponses.map(response => response.json()));
      const karst = await Promise.all(karstResponses.map(response => response.json()));
      map.addSource('demo',{type:'geojson',data:demo});
      map.addSource('worldmove',{type:'geojson',data:worldMove});
      map.addLayer({id:'worldmove',type:'line',source:'worldmove',paint:{'line-color':'#e76f51','line-width':2,'line-opacity':0.75}});
      map.addSource('dtm-displacement',{type:'geojson',data:dtm});
      map.addLayer({id:'dtm-displacement',type:'circle',source:'dtm-displacement',paint:{'circle-color':'#8e44ad','circle-radius':6,'circle-stroke-color':'#fff','circle-stroke-width':1.5,'circle-opacity':0.8}});
      map.addLayer({id:'flow',type:'line',source:'demo',filter:['==',['get','layer'],'flow'],paint:{'line-color':'#d96c42','line-width':['interpolate',['linear'],['get','count'],2800,2,12000,7],'line-opacity':.85,'line-dasharray':[1,1]}});
      ['health','shelter','transport'].forEach((kind) => map.addLayer({id:kind,type:'circle',source:'demo',filter:['==',['get','layer'],kind],paint:{'circle-color':kind==='health'?'#147d7e':kind==='shelter'?'#7a55a3':'#314e63','circle-radius':7,'circle-stroke-color':'#fff','circle-stroke-width':2}}));
      map.addSource('healthsites',{type:'geojson',data:healthsites});
      map.addLayer({id:'healthsites',type:'circle',source:'healthsites',paint:{'circle-color':'#f0a202','circle-radius':5,'circle-stroke-color':'#fff','circle-stroke-width':1.5,'circle-opacity':0.9}});
      map.addSource('bats',{type:'geojson',data:bats});
      map.addLayer({id:'bats',type:'circle',source:'bats',paint:{'circle-color':'#6a3d9a','circle-radius':3.5,'circle-stroke-color':'#fff','circle-stroke-width':0.8,'circle-opacity':0.7}});
      map.addSource('overture-buildings',{type:'geojson',data:buildings});
      map.addLayer({id:'overture-buildings',type:'fill',source:'overture-buildings',paint:{'fill-color':'#e07a5f','fill-opacity':0.45,'fill-outline-color':'#9d4e3d'}});
      map.addSource('osm-poi',{type:'geojson',data:osmPoi});
      map.addLayer({id:'osm-poi',type:'circle',source:'osm-poi',paint:{'circle-color':'#2a9d8f','circle-radius':5,'circle-stroke-color':'#fff','circle-stroke-width':1.2,'circle-opacity':0.9}});
      map.addSource('airports',{type:'geojson',data:airports});
      map.addLayer({id:'airports',type:'circle',source:'airports',minzoom:3,paint:{'circle-color':'#f4a261','circle-radius':5,'circle-stroke-color':'#fff','circle-stroke-width':1.2,'circle-opacity':0.9}});
      map.addSource('hydrorivers',{type:'geojson',data:hydroRivers});
      map.addLayer({id:'hydrorivers',type:'line',source:'hydrorivers',minzoom:4,paint:{'line-color':'#2b83ba','line-width':['interpolate',['linear'],['zoom'],4,0.7,8,1.5,12,2.5],'line-opacity':0.78}});
      const karstStyles = [
        ['karst','fill',{ 'fill-color':'#c9943e','fill-opacity':0.2}],
        ['caves','circle',{ 'circle-color':'#7b2d26','circle-radius':5,'circle-stroke-color':'#fff','circle-stroke-width':1}],
        ['non-exposed-karst','circle',{ 'circle-color':'#777','circle-radius':4,'circle-stroke-color':'#fff','circle-stroke-width':1}],
        ['springs','circle',{ 'circle-color':'#168aad','circle-radius':5,'circle-stroke-color':'#fff','circle-stroke-width':1}]
      ];
      karst.forEach((layerData, index) => {
        const [name, type, paint] = karstStyles[index];
        map.addSource(name,{type:'geojson',data:layerData});
        map.addLayer({id:name,type,source:name,paint});
        if (name === 'karst') map.addLayer({id:'karst-outline',type:'line',source:name,paint:{'line-color':'#9a6b21','line-width':1,'line-opacity':0.8}});
      });
      gadm.forEach((boundaries, index) => {
        const id = `gadm-${index}`;
        map.addSource(id,{type:'geojson',data:boundaries});
        map.addLayer({id:`${id}-fill`,type:'fill',source:id,paint:{'fill-color':'#2b6f77','fill-opacity':0.03}});
        map.addLayer({id:`${id}-line`,type:'line',source:id,paint:{'line-color':'#315b66','line-width':1.2,'line-opacity':0.75}});
      });
      map.on('click',['flow','health','shelter','transport','healthsites','bats','overture-buildings'],e=>new maplibregl.Popup().setLngLat(e.lngLat).setHTML('<strong>'+(e.features[0].properties.name||e.features[0].properties.primary_name||e.features[0].properties.Species||'African bat occurrence')+'</strong><br><small>'+(e.features[0].layer.id==='healthsites'?'Healthsites.io export — verify date and completeness.':e.features[0].layer.id==='bats'?'African Bat Database occurrence — verify record date and coordinate precision.':e.features[0].layer.id==='overture-buildings'?'Overture building footprint — sampled Goma extract; verify release and coverage.':'Demo layer — replace with a dated source extract.')+'</small>').addTo(map));
      map.on('click',['osm-poi'],e=>new maplibregl.Popup().setLngLat(e.lngLat).setHTML('<strong>'+(e.features[0].properties.name||e.features[0].properties.amenity||e.features[0].properties.shop||e.features[0].properties.tourism||'OpenStreetMap POI')+'</strong><br><small>OpenStreetMap POI — sampled Goma extract; verify tags and completeness.</small>').addTo(map));
      map.on('click',['airports'],e=>new maplibregl.Popup().setLngLat(e.lngLat).setHTML('<strong>'+(e.features[0].properties.name||e.features[0].properties.name_en||'Airport')+'</strong><br><small>Natural Earth 10m airports — verify location and operational status.</small>').addTo(map));
    });
  </script>
</body>
</html>
