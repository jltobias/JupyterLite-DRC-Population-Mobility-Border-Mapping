name: Deploy browser workspace

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Install JupyterLite
        run: python -m pip install "jupyterlite-core==0.6.4" "jupyterlite-pyodide-kernel==0.6.1" "jupyter-server>=2,<3"
      - name: Build JupyterLite
        run: jupyter lite build --contents contents --output-dir dist
      - name: Copy static maps
        run: cp -R maps dist/maps
      - name: Add African Bat Database GeoJSON layer
        run: |
          python - <<'PY'
          import csv, io, json, pathlib, urllib.request
          csv.field_size_limit(10_000_000)
          url = 'https://ndownloader.figshare.com/files/67270397'
          raw = urllib.request.urlopen(url).read().decode('cp1252')
          rows = csv.DictReader(io.StringIO(raw))
          features = []
          for row in rows:
              try:
                  lon = float((row.get('Longitude') or '').strip())
                  lat = float((row.get('Latitude') or '').strip())
              except (KeyError, TypeError, ValueError):
                  continue
              properties = {k: v for k, v in row.items() if k not in ('Longitude', 'Latitude')}
              features.append({'type': 'Feature', 'properties': properties,
                               'geometry': {'type': 'Point', 'coordinates': [lon, lat]}})
          output = pathlib.Path('dist/data/african-bat-database.geojson')
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps({'type': 'FeatureCollection', 'name': 'African Bat Database v2.0', 'features': features}, ensure_ascii=False), encoding='utf-8')
          print(f'Wrote {len(features)} bat occurrence features to {output}')
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
